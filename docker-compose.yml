services:
  postgres:
    image: postgres:15-alpine
    container_name: genesis_postgres
    restart: always
    mem_limit: 280m
    command: ["postgres", "-c", "max_connections=80", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "checkpoint_completion_target=0.9"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genesis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genesis_strong_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genesis_admin} -d ${POSTGRES_DB:-genesis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genesis_net

  backend:
    build: ./backend
    container_name: genesis_backend
    restart: always
    mem_limit: 460m
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-genesis_admin}:${POSTGRES_PASSWORD:-genesis_strong_pass_2026}@postgres:5432/${POSTGRES_DB:-genesis_db}
      SECRET_KEY: ${SECRET_KEY:-genesis_jwt_secret_2026_prod}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-genesis_admin_master_2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SNAPSHOT_INTERVAL_SECONDS: ${SNAPSHOT_INTERVAL_SECONDS:-5.0}
      AUTO_RESTORE_ON_BOOT: ${AUTO_RESTORE_ON_BOOT:-true}
      STANDBY_SYNC_URL: ${STANDBY_SYNC_URL:-}
      PRIMARY_SYNC_URL: ${PRIMARY_SYNC_URL:-}
      STANDBY_SYNC_SECRET: ${STANDBY_SYNC_SECRET:-genesis_standby_sync_2026}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      SUPABASE_SNAPSHOT_TABLE: ${SUPABASE_SNAPSHOT_TABLE:-genesis_snapshots}
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - genesis_net

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_FALLBACK_URLS: ${VITE_FALLBACK_URLS:-}
    container_name: genesis_nginx
    restart: always
    mem_limit: 120m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - genesis_net

networks:
  genesis_net:
    driver: bridge

