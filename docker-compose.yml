services:
  postgres:
    image: postgres:15-alpine
    container_name: genesis_postgres
    restart: always
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genesis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genesis_strong_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-genesis_db}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-genesis_admin} -d ${POSTGRES_DB:-genesis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - genesis_net

  backend:
    build: ./backend
    container_name: genesis_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-genesis_admin}:${POSTGRES_PASSWORD:-genesis_strong_pass_2026}@postgres:5432/${POSTGRES_DB:-genesis_db}
      SECRET_KEY: ${SECRET_KEY:-genesis_jwt_secret_2026_prod}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-genesis_admin_master_2026}
      STANDBY_SYNC_URL: ${STANDBY_SYNC_URL:-}
      STANDBY_SYNC_SECRET: ${STANDBY_SYNC_SECRET:-genesis_standby_sync_2026}
      BACKUP_DIR: /app/backups
    volumes:
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - genesis_net

  nginx:
    image: nginx:alpine
    container_name: genesis_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - genesis_net

networks:
  genesis_net:
    driver: bridge

